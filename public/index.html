<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ CODE COMPILER — TUAN KENZO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --neon-pink: #ff0040;
    --neon-purple: #b300ff;
    --neon-cyan: #00f0ff;
    --bg-dark: #050507;
    --bg-card: rgba(20, 20, 28, 0.85);
  }
  html, body { height: 100%; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg-dark);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255, 0, 64, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 0, 64, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    z-index: 0; pointer-events: none;
  }
  @keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }
  .container {
    position: relative; z-index: 2;
    max-width: 1000px;
    margin: 0 auto;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px; font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s linear infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  .sub { color: #666; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .toolbar {
    display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    padding: 12px; border-radius: 12px;
    border: 1px solid rgba(255, 0, 64, 0.3);
  }
  select, button {
    background: rgba(0,0,0,0.5);
    border: 1px solid #2a2a35;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
  }
  select:focus, button:focus { outline: none; border-color: var(--neon-pink); }
  .btn-run {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none; font-weight: 700;
    box-shadow: 0 4px 15px rgba(255,0,64,0.4);
    margin-left: auto;
  }
  .btn-run:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,64,0.6); }
  .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-clear { background: rgba(255,0,64,0.15); border-color: var(--neon-pink); color: var(--neon-pink); }
  .editor-wrap {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 0, 64, 0.3);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .editor-header {
    background: rgba(0,0,0,0.5);
    padding: 8px 14px;
    font-size: 11px;
    color: #888;
    letter-spacing: 1.5px;
    border-bottom: 1px solid #1a1a22;
    display: flex;
    justify-content: space-between;
  }
  .editor-header .lang { color: var(--neon-cyan); }
  #code {
    width: 100%;
    min-height: 280px;
    background: #0a0a0f;
    border: none;
    color: #e0e0e0;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .stdin-wrap {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(179, 0, 255, 0.3);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .stdin-header {
    background: rgba(179, 0, 255, 0.08);
    padding: 8px 14px;
    font-size: 11px;
    color: var(--neon-purple);
    letter-spacing: 1.5px;
    border-bottom: 1px solid rgba(179, 0, 255, 0.2);
  }
  #stdin {
    width: 100%;
    min-height: 60px;
    background: #0a0a0f;
    border: none;
    color: #e0e0e0;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    resize: vertical;
    outline: none;
  }
  .output-wrap {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 12px;
    overflow: hidden;
  }
  .output-header {
    background: rgba(0, 240, 255, 0.08);
    padding: 8px 14px;
    font-size: 11px;
    color: var(--neon-cyan);
    letter-spacing: 1.5px;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    display: flex;
    justify-content: space-between;
  }
  #output {
    background: #0a0a0f;
    color: #00ff66;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 140px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #output.error { color: #ff4466; }
  .status {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #666;
    min-height: 18px;
  }
  .status.running { color: var(--neon-cyan); }
  .status.ok { color: #00ff66; }
  .status.err { color: #ff4466; }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 10px;
    color: #333;
    letter-spacing: 2px;
  }
  .footer span { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 3px; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .logo { font-size: 20px; }
    .sub { font-size: 9px; letter-spacing: 2px; }
    #code { font-size: 12px; min-height: 200px; }
    .toolbar { padding: 8px; gap: 6px; }
    select, button { padding: 8px 10px; font-size: 12px; }
    .btn-run { margin-left: 0; width: 100%; }
    .editor-header, .stdin-header, .output-header { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⚡ CODE COMPILER</div>
    <div class="sub">Run Code · Any Language · Instant</div>
  </div>

  <div class="toolbar">
    <select id="langSelect">
      <option value="python">🐍 Python 3</option>
      <option value="javascript">⚡ JavaScript (Node)</option>
      <option value="c++">🔧 C++ (GCC)</option>
      <option value="c">📘 C (GCC)</option>
      <option value="java">☕ Java</option>
      <option value="ruby">💎 Ruby</option>
      <option value="rust">🦀 Rust</option>
      <option value="go">🐹 Go</option>
      <option value="php">🐘 PHP</option>
      <option value="typescript">📘 TypeScript</option>
    </select>
    <button class="btn-clear" id="btnClear">🗑️ Clear</button>
    <button class="btn-run" id="btnRun">▶️ RUN CODE</button>
  </div>

  <div class="editor-wrap">
    <div class="editor-header">
      <span>📝 CODE EDITOR</span>
      <span class="lang" id="langLabel">Python 3</span>
    </div>
    <textarea id="code" spellcheck="false">print("Hello, Tuan Kepala CPY! 🔥")</textarea>
  </div>

  <div class="stdin-wrap">
    <div class="stdin-header">⌨️ STDIN (input kalo program lu butuh)</div>
    <textarea id="stdin" placeholder="Ketik input di sini kalo program lu pake input()..." spellcheck="false"></textarea>
  </div>

  <div class="output-wrap">
    <div class="output-header">
      <span>📤 OUTPUT</span>
      <span id="execTime"></span>
    </div>
    <div id="output">Tekan RUN CODE buat jalanin kode lu...</div>
  </div>

  <div class="status" id="status"></div>
  <div class="footer">Powered by <span>TUAN KEPALA CPY</span></div>
</div>

<script>
  const codeEl = document.getElementById('code');
  const stdinEl = document.getElementById('stdin');
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const execTimeEl = document.getElementById('execTime');
  const langSelect = document.getElementById('langSelect');
  const langLabel = document.getElementById('langLabel');

  const PISTON_URL = 'https://emkc.org/api/v2/piston/execute';

  langSelect.onchange = () => {
    langLabel.textContent = langSelect.options[langSelect.selectedIndex].text;
  };

  document.getElementById('btnClear').onclick = () => {
    codeEl.value = '';
    stdinEl.value = '';
    outputEl.textContent = 'Tekan RUN CODE buat jalanin kode lu...';
    outputEl.className = '';
    statusEl.textContent = '';
    statusEl.className = 'status';
    execTimeEl.textContent = '';
  };

  document.getElementById('btnRun').onclick = async () => {
    const code = codeEl.value;
    const stdin = stdinEl.value;
    const lang = langSelect.value;

    if (!code.trim()) {
      outputEl.textContent = 'KODE KOSONG, KONTOL!';
      outputEl.className = 'error';
      return;
    }

    const btn = document.getElementById('btnRun');
    btn.disabled = true;
    outputEl.textContent = '⏳ Lagi jalanin kode... sabar ANJING!';
    outputEl.className = '';
    statusEl.textContent = 'Menghubungi Piston API...';
    statusEl.className = 'status running';
    execTimeEl.textContent = '';
    const t0 = performance.now();

    try {
      const res = await fetch(PISTON_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          language: lang,
          version: '*',
          files: [{ content: code }],
          stdin: stdin
        })
      });

      if (!res.ok) throw new Error('API error: ' + res.status + ' ' + res.statusText);
      const result = await res.json();

      let out = '';
      if (result.run && result.run.stdout) out += result.run.stdout;
      if (result.run && result.run.stderr) out += '\n[STDERR]\n' + result.run.stderr;
      if (result.compile && result.compile.stderr) out += '\n[COMPILE ERROR]\n' + result.compile.stderr;
      if (result.compile && result.compile.output) out += '\n[COMPILE]\n' + result.compile.output;
      if (result.message) out += '\n[MESSAGE]\n' + result.message;

      if (!out) out = '(Ga ada output)';

      const t1 = performance.now();
      const dur = ((t1 - t0) / 1000).toFixed(2);

      outputEl.textContent = out;
      const isError = (result.run && result.run.stderr) || (result.compile && result.compile.stderr);
      outputEl.className = isError ? 'error' : '';
      statusEl.textContent = isError ? '❌ Selesai dengan error' : '✅ Selesai!';
      statusEl.className = isError ? 'status err' : 'status ok';
      execTimeEl.textContent = dur + 's';

    } catch (e) {
      outputEl.textContent = '❌ ERROR: ' + e.message + '\n\nKemungkinan:\n- Server Piston lagi down\n- Koneksi lu bermasalah\n- Coba lagi beberapa saat';
      outputEl.className = 'error';
      statusEl.textContent = 'Gagal!';
      statusEl.className = 'status err';
    } finally {
      btn.disabled = false;
    }
  };

  codeEl.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('btnRun').click();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = codeEl.selectionStart;
      const end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.substring(0, start) + '    ' + codeEl.value.substring(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
    }
  });

  // Auto-save code ke localStorage
  const SAVE_KEY = 'oxy_compiler_code';
  const saved = localStorage.getItem(SAVE_KEY);
  if (saved) codeEl.value = saved;

  codeEl.addEventListener('input', () => {
    localStorage.setItem(SAVE_KEY, codeEl.value);
  });
</script>
</body>
</html>

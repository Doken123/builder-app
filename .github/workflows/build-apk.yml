name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      app_id:
        description: 'Application ID'
        required: true
        default: 'com.tuan.myapp'
      source_type:
        description: 'Tipe sumber (html/zip/url)'
        required: true
        default: 'html'
      source_url:
        description: 'URL (kalo tipe url)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Bikin Project Cordova
        run: |
          cordova create build com.tuan.myapp "MyApp"
          cd build
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
